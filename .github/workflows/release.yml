name: Release

permissions:
  contents: write

on:
  push:
  release:
    types: [published]

concurrency:
  group: ${{format('release-{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

env:
  BOOST_VERSION: 1.87.0 # Use a recent one to benefit from bugfixes and performance improvements

defaults:
  run:
    shell: bash

jobs:
  Release:
    strategy:
      matrix:
        include:
          - { compiler: gcc-14,   os: ubuntu-24.04 }
          - { compiler: msvc,     os: windows-2025 }

    runs-on: ${{matrix.os}}

    steps:
      - run: |
          echo "DEPS_DIR=${{runner.temp}}/.cache" >> $GITHUB_ENV
          echo "LIBUTIL_DIR=$GITHUB_WORKSPACE/external/libutil" >> $GITHUB_ENV
          echo "LIBENDIAN_DIR=$GITHUB_WORKSPACE/external/libendian" >> $GITHUB_ENV
      - name: Extract tag name
        id: filenames
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if [[ "$tag" =~ refs/ ]]; then tag="NoTag"; fi
          echo "Using tag: $tag"
          echo "foldername=rttrUtils_$tag" >> "$GITHUB_OUTPUT"
          echo "filename=rttrUtils-${{runner.os}}-${tag}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout libutil
        with:
          repository: Return-To-The-Roots/libutil
          ref: master
          path: external/libutil
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout libendian
        with:
          repository: Return-To-The-Roots/libendian
          ref: master
          path: external/libendian

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{env.DEPS_DIR}}
          key: ${{matrix.os}}-${{matrix.compiler}}-${{env.BOOST_VERSION}}

      - name: Install Compiler
        if: "startsWith(runner.os, 'Linux')"
        run: |
          pkgs=${{matrix.compiler}}
          pkgs=${pkgs/gcc-/g++-}
          sudo apt install $pkgs
      - name: Setup compiler
        if: "!startsWith(runner.os, 'Windows')"
        run: tools/ci/setupCompiler.sh
        env:
          COMPILER: ${{matrix.compiler}}

      - name: Install system packages (Linux)
        if: "startsWith(runner.os, 'Linux')"
        run: sudo apt install cmake cmake-data ccache libminiupnpc-dev
      - name: Install system packages (OSX)
        if: startsWith(runner.os, 'macOS')
        run: brew install ccache cmake miniupnpc
      - name: Install system packages (Windows)
        if: startsWith(runner.os, 'Windows')
        run: choco install wget
      - name: Setup cmake
        if: "!startsWith(runner.os, 'Windows')"
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3  # v2.2.0
        with:
          cmake-version: '3.20.x'

      - name: Setup CCache
        if: "!startsWith(runner.os, 'Windows')"
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: ${{matrix.os}}-${{matrix.compiler}}
          max-size: 200M

      - name: Install Boost
        shell: bash
        run: |
          if [[ $RUNNER_OS == "Windows" ]]; then
            DEPS_DIR=$(cygpath -u "$DEPS_DIR")
            # Avoid mixing different Perl version and libraries
            perlPath=/c/Strawberry/perl/bin
            if [[ -d "$perlPath" ]]; then
              export PATH="$perlPath:$PATH"
            fi
          fi
          BOOST_ROOT="${DEPS_DIR}/boost${BOOST_VERSION}"
          echo "BOOST_ROOT=${BOOST_ROOT}" >> $GITHUB_ENV
          echo "ADDITIONAL_CMAKE_FLAGS=${ADDITIONAL_CMAKE_FLAGS} -DBoost_NO_SYSTEM_PATHS=ON " >> $GITHUB_ENV
          VARIANT=release $LIBUTIL_DIR/tools/ci/installBoost.sh "${BOOST_VERSION}" "${BOOST_ROOT}" "filesystem,system,program_options,thread,test,locale,iostreams,regex"

      - name: Build
        run: tools/ci/build.sh "Release" "${ADDITIONAL_CMAKE_FLAGS}"

      - name: Package
        run: |
          mv installed ${{steps.filenames.outputs.foldername}}
          tar -zvcf "${{steps.filenames.outputs.filename}}" ${{steps.filenames.outputs.foldername}}
        working-directory: build

      - name: Check asset
        run: ls build/${{steps.filenames.outputs.filename}} # Just check that uploading would work (asset_path exists)
      - name: Upload
        if: success() && github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          working_directory: build
          files: ${{steps.filenames.outputs.filename}}
          fail_on_unmatched_files: true
